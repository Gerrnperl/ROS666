[package]
name = "ros666"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
riscv = "0.12.1"
rustsbi = { version = "0.4.0", features = ["forward"] }
common = { path = "./common" }
slab_allocator = { path = "./slab_allocator" }
bitflags = "2.6.0"
xmas-elf = "0.9.1"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[workspace]

members = [
    "user",
    "user-lib",
    "user-build",
    "common",
    "slab_allocator",
]
